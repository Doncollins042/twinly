<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sign in · Twinly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;background:#070b0a;color:#e9f2ed;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(700px 420px at 80% -10%,rgba(62,230,168,.12),transparent 60%),radial-gradient(600px 400px at -10% 110%,rgba(124,192,255,.06),transparent 60%)}
.card{width:min(380px,100%);padding:34px 28px 28px;border-radius:22px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.mark{width:52px;height:52px;margin-bottom:22px}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:38px;line-height:1.05}
h1 i{color:#3ee6a8}
p{color:#93a39c;font-size:14px;margin:8px 0 24px;line-height:1.5}
label{display:block;font-size:12.5px;color:#93a39c;margin-bottom:8px}
.pw{position:relative}
input{width:100%;height:52px;padding:0 52px 0 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);color:#e9f2ed;font-size:17px;outline:none;font-family:inherit}
input:focus{border-color:rgba(62,230,168,.6);box-shadow:0 0 0 4px rgba(62,230,168,.12)}
.eye{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;background:none;color:#93a39c;cursor:pointer;border-radius:10px}
.eye svg{width:20px;height:20px}
button.go{width:100%;height:52px;margin-top:14px;border:0;border-radius:14px;background:#3ee6a8;color:#04140d;font-weight:600;font-size:16px;cursor:pointer;font-family:inherit}
button.go:active{transform:scale(.99)}
.err{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(255,107,125,.12);border:1px solid rgba(255,107,125,.3);color:#ffc2ca;font-size:13px}
.err.on{display:block}
.hint{margin-top:18px;font-size:12px;color:#5f6e68;line-height:1.5}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <svg class="mark" viewBox="0 0 34 34" fill="none"><rect width="34" height="34" rx="10" fill="#0d1613" stroke="rgba(255,255,255,.08)"/><circle cx="13.5" cy="17" r="7.2" stroke="#3ee6a8" stroke-width="2.3"/><circle cx="20.5" cy="17" r="7.2" stroke="#e9f2ed" stroke-opacity=".85" stroke-width="2.3"/></svg>
  <h1>Welcome to <i>Twinly</i></h1>
  <p>Enter the password you chose during setup. You'll stay signed in on this device.</p>
  <label for="pw">Password</label>
  <div class="pw">
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
    <button class="eye" type="button" aria-label="Show password" onclick="const i=document.getElementById('pw');i.type=i.type==='password'?'text':'password'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="err" id="err">That password isn't right. Try again.</div>
  <button class="go" type="submit">Sign in</button>
  <div class="hint">Forgot it? On the Twinly computer, open Twinly there (no password needed) or check the <b>DASHBOARD_PASSWORD</b> line in the <b>.env</b> file.</div>
</form>
<script>if (location.search.includes('wrong')) document.getElementById('err').classList.add('on');</script>
</body>
</html>
